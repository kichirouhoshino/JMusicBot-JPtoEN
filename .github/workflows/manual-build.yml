# Manual build workflow - triggered by workflow_dispatch
name: Manual Build with Maven

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
          - macos-x86_64
          - macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Build with Maven (${{ matrix.platform }})
        run: mvn --batch-mode --update-snapshots package -P ${{ matrix.platform }}

      - name: Upload artifact (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmusicbot-${{ matrix.platform }}
          path: target/*-${{ matrix.platform }}.jar
